<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><meta name="theme-color" content="#14100e"><title>MAD MAX V8</title><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#483025,#0e0d0d 70%);color:#f5e6c7;font-family:system-ui;text-align:center;touch-action:manipulation}h1{font-size:32px;letter-spacing:5px;margin:22px 0 0;color:#ff7a31}small{color:#a89b8b}.dash{display:flex;justify-content:center;gap:15px;margin:24px 0}.dial{width:44vw;max-width:210px;aspect-ratio:1;border:9px solid #555;border-radius:50%;background:#171716;display:grid;place-content:center;box-shadow:0 0 25px #000}.number{font-size:clamp(27px,9vw,48px);font-weight:900}.unit{font-size:12px;color:#bcae9c}.red{color:#ff7539}.status{padding:12px;color:#c9b9a3}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:14px;max-width:650px;margin:auto}button{border:1px solid #966243;border-radius:16px;padding:22px 8px;background:#30251f;color:#fff2df;font-size:18px;font-weight:bold;touch-action:none;user-select:none;-webkit-user-select:none}button:active,.pressed{background:#db5c21}#gas{grid-row:span 2;background:#a94418;font-size:26px}#gas:active{background:#fa7d2f}#start{background:#464c35}.hint{font-size:12px;color:#8f8375;padding:12px}#bar{height:10px;background:#382c28;margin:0 20px;border-radius:10px;overflow:hidden}#fill{height:100%;width:0;background:linear-gradient(90deg,#d89d42,#ff3e22)}@media(orientation:landscape){h1{margin:6px}.dash{margin:7px}.dial{width:24vh;border-width:5px}.buttons{max-width:500px;padding:3px}button{padding:10px}}</style><h1>MAD MAX <span style="color:#eee">V8</span></h1><small>WASTELAND ENGINE SIMULATOR</small><div class="dash"><div class="dial"><div id="rpm" class="number red">0</div><div class="unit">RPM</div></div><div class="dial"><div id="speed" class="number">0</div><div class="unit">KM/H</div></div></div><div id="bar"><div id="fill"></div></div><div class="status" id="status">ENGINE OFF · N</div><div class="buttons"><button id="start">⚡ 点火启动</button><button id="gas">🔥 按住油门</button><button id="down">－ 降挡</button><button id="up">＋ 升挡</button><button id="brake">🛑 刹车</button></div><div class="hint">iPhone 首次点击点火后启用音效 · 模拟物理仅供娱乐</div><script>let on=false,gas=false,brake=false,gear=0,rpm=0,speed=0,ctx,osc,noise,gain;const $=id=>document.getElementById(id);function audio(){try{ctx??=new(window.AudioContext||window.webkitAudioContext)();ctx.resume();if(!osc){osc=ctx.createOscillator();gain=ctx.createGain();osc.type='sawtooth';osc.connect(gain).connect(ctx.destination);gain.gain.value=0;osc.start()}}catch(e){}}$('start').onclick=()=>{audio();on=!on;if(!on){gas=false;gear=0}$('start').textContent=on?'⏻ 熄火':'⚡ 点火启动'};function hold(id,set){let b=$(id);b.addEventListener('pointerdown',e=>{e.preventDefault();audio();set(true);b.setPointerCapture(e.pointerId)});for(let ev of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(ev,()=>set(false))}hold('gas',v=>gas=v);hold('brake',v=>brake=v);$('up').onclick=()=>{if(on)gear=Math.min(6,gear+1)};$('down').onclick=()=>{if(on)gear=Math.max(0,gear-1)};let last=performance.now();function tick(t){let dt=Math.min((t-last)/1000,.08);last=t;let target=on?(gas?6800:850):0;if(on&&gear>0)target=Math.max(target,850+speed*(100/gear));rpm+=(Math.min(7100,target)-rpm)*Math.min(1,dt*(gas?3:2));if(on&&gear>0){let acc=gas?(10/Math.sqrt(gear)):-4;speed=Math.max(0,Math.min(260,speed+acc*dt))}else speed=Math.max(0,speed-3*dt);if(brake)speed=Math.max(0,speed-26*dt);$('rpm').textContent=Math.round(rpm/10)*10;$('speed').textContent=Math.round(speed);$('fill').style.width=Math.min(100,rpm/70)+'%';$('status').textContent=(on?'ENGINE RUNNING':'ENGINE OFF')+' · '+(gear||'N')+(rpm>6700?' · LIMITER':'');if(osc&&ctx){osc.frequency.setTargetAtTime(Math.max(25,rpm/26),ctx.currentTime,.05);gain.gain.setTargetAtTime(on?(gas?.065:.023):0,ctx.currentTime,.08)}requestAnimationFrame(tick)}requestAnimationFrame(tick);document.addEventListener('visibilitychange',()=>{if(document.hidden){gas=false;brake=false}})</script></html>
